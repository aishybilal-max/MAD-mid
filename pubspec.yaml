name: seaside_tasks
description: Seaside Tasks - a sparkly sea-themed task management app (Flutter + SQLite).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  sqflite: ^2.3.3+1
  sqflite_common_ffi_web: ^0.4.5
  path: ^1.9.0
  path_provider: ^2.1.4
  shared_preferences: ^2.3.2
  flutter_local_notifications: ^17.2.4
  timezone: ^0.9.4
  intl: ^0.19.0
  pdf: ^3.11.1
  share_plus: ^10.0.2
  audioplayers: ^6.7.1

# Fix: image 4.11.0 needs a newer 'archive' than some Dart SDKs allow (decodeLazy error)
dependency_overrides:
  image: 4.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/sounds/
  fonts:
    - family: Celestial
      fonts:
        - asset: assets/fonts/CinzelDecorative-Regular.ttf
        - asset: assets/fonts/CinzelDecorative-Bold.ttf
          weight: 700
    - family: Quicksand
      fonts:
        - asset: assets/fonts/Quicksand.ttf
